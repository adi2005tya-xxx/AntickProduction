<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wada Vivah Patrika</title>
<meta name="description" content="A cinematic wedding invitation set in a Peshwa-era wada.">
<link rel="preload" as="image" href="assets/wada/gate.jpg">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&family=Yatra+One&display=swap" rel="stylesheet">
<style>
:root{--brass:#c9a15a;--brass2:#f0d28f;--wood:#1b110a;--wood2:#2b1a10;--ink:#3a2414;--kum:#a3231f;--light:#f3e6c8;
 --disp:'Yatra One','Tiro Devanagari Marathi',serif;--body:'Tiro Devanagari Marathi',Georgia,serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:#120a05;color:var(--light);line-height:1.9;font-size:1.1rem;overflow-x:hidden}
body.locked{overflow:hidden;height:100vh}
button,input,select,textarea{font:inherit}
img{display:block}
/* film grain + vignette over everything for a photographic feel */
body::after{content:"";position:fixed;inset:0;z-index:900;pointer-events:none;opacity:.13;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ============ INTRO: walk through the real gate ============ */
#intro{position:fixed;inset:0;z-index:600;background:#0a0603;overflow:hidden;cursor:pointer;transition:opacity 1.8s ease,visibility 1.8s}
#intro.gone{opacity:0;visibility:hidden}
#cam{position:absolute;inset:0;will-change:transform,filter}
#cam img{width:100%;height:100%;object-fit:cover;object-position:50% 55%;filter:sepia(.28) saturate(1.1) contrast(1.06) brightness(.82)}
.shade{position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(180deg,rgba(12,6,2,.78),rgba(12,6,2,.08) 34%,rgba(40,16,0,.12) 62%,rgba(8,4,1,.85)),radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55))}
.black{position:absolute;inset:0;background:#0a0603;opacity:0;pointer-events:none}
.ttl{position:absolute;top:6vh;left:0;right:0;text-align:center;font-family:var(--disp);font-size:clamp(1.3rem,4.4vw,2.6rem);color:var(--brass2);text-shadow:0 0 20px rgba(255,170,60,.65),0 2px 6px #000;transition:opacity .6s}
.ttl small{display:block;font-family:var(--body);font-size:clamp(.85rem,2vw,1.05rem);color:var(--light);letter-spacing:.12em;margin-top:.2rem;opacity:.85}
.touch{position:absolute;left:50%;bottom:7vh;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.6rem;background:none;border:0;color:var(--light);cursor:pointer;transition:opacity .5s;text-shadow:0 2px 8px #000}
.lamp{width:84px;height:84px;border-radius:50%;overflow:hidden;border:3px solid var(--brass);box-shadow:0 0 0 0 rgba(255,180,70,.6);animation:ring 2.4s infinite}
.lamp img{width:100%;height:100%;object-fit:cover}
@keyframes ring{70%{box-shadow:0 0 0 22px rgba(255,180,70,0)}100%{box-shadow:0 0 0 0 rgba(255,180,70,0)}}
#intro.open .ttl,#intro.open .touch{opacity:0}
#intro.open #cam{animation:dolly 3.8s cubic-bezier(.45,0,.75,.5) forwards}
#intro.open .black{animation:blackout 1.4s 2.2s ease-in forwards}
@keyframes dolly{to{transform:scale(3.3);filter:blur(2.5px)}}
@keyframes blackout{to{opacity:1}}

.langbtn{position:fixed;top:14px;right:14px;z-index:650;background:rgba(20,10,5,.7);backdrop-filter:blur(6px);color:var(--brass2);border:1px solid var(--brass);padding:.1rem 1rem;border-radius:20px;cursor:pointer;font-family:var(--disp)}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* ============ PAGE ============ */
main{opacity:0;transition:opacity 1.2s}
body.ready main{opacity:1}
section{position:relative}
.wrap{max-width:1000px;margin:auto;padding:clamp(4rem,9vw,7rem) clamp(1.2rem,5vw,2.5rem);text-align:center}
.rv{opacity:0;transform:translateY(36px);transition:opacity 1.1s,transform 1.1s}.rv.in{opacity:1;transform:none}
h2{font-family:var(--disp);font-weight:400;font-size:clamp(2rem,6vw,3.3rem);color:var(--brass2);line-height:1.3}
.hair{width:min(240px,60%);height:1px;margin:.7rem auto 2.2rem;background:linear-gradient(90deg,transparent,var(--brass),transparent)}

/* hero */
#hero{min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
.hbg{position:absolute;inset:0;overflow:hidden}
.hbg img{width:100%;height:100%;object-fit:cover;object-position:60% 60%;filter:sepia(.2) saturate(1.12) contrast(1.05) brightness(.95);animation:pan 46s ease-in-out infinite alternate;transform:scale(1.12)}
body.ready .hbg{animation:arrive 3.2s ease-out}
@keyframes pan{from{transform:scale(1.12) translateX(-2.5%)}to{transform:scale(1.12) translateX(2.5%)}}
@keyframes arrive{from{transform:scale(1.3);filter:brightness(.3)}to{transform:none;filter:none}}
.hshade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(14,7,3,.28),rgba(14,7,3,.62) 80%),linear-gradient(180deg,rgba(14,7,3,.5),transparent 28%,rgba(14,7,3,.8))}
.flick{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 105%,rgba(255,160,50,.32),transparent 60%);animation:fk 3.4s infinite}
@keyframes fk{0%,100%{opacity:.9}20%{opacity:.55}40%{opacity:1}60%{opacity:.7}80%{opacity:.95}}
.toranwrap{position:absolute;top:0;left:0;right:0;z-index:6;filter:drop-shadow(0 10px 8px rgba(0,0,0,.55));pointer-events:none}
.toran{height:130px;background:url(assets/wada/marigold.jpg) center/cover;transform-origin:top center;animation:sway 7s ease-in-out infinite;
 -webkit-mask:linear-gradient(#000,#000) top/100% 70px no-repeat,radial-gradient(circle at 50% 0,#000 33px,transparent 34px) bottom/68px 60px repeat-x;
 mask:linear-gradient(#000,#000) top/100% 70px no-repeat,radial-gradient(circle at 50% 0,#000 33px,transparent 34px) bottom/68px 60px repeat-x}
@keyframes sway{50%{transform:rotate(.5deg) translateX(3px)}}
.hin{position:relative;z-index:5;padding:150px 1.2rem 5rem}
.shl{font-family:var(--disp);color:var(--brass2);font-size:clamp(1.3rem,4vw,2.1rem);text-shadow:0 2px 10px #000}
.sh2{white-space:pre-line;font-style:italic;opacity:.85;font-size:clamp(.92rem,2.3vw,1.15rem);margin:.3rem 0 1.4rem;text-shadow:0 2px 8px #000}
.wv{font-family:var(--disp);color:var(--brass);font-size:clamp(1.2rem,3.4vw,1.9rem);letter-spacing:.14em}
.names{font-family:var(--disp);font-weight:400;font-size:clamp(3.2rem,13vw,8.5rem);line-height:1.15;text-shadow:0 4px 30px rgba(0,0,0,.8)}
.names i{display:block;font-style:normal;font-size:.26em;color:var(--brass);line-height:1}
.dt{font-size:clamp(1.2rem,3.4vw,1.8rem);color:var(--brass2);margin-top:.8rem;text-shadow:0 2px 8px #000}
.mu{opacity:.85;text-shadow:0 2px 8px #000}
.cd{display:flex;gap:clamp(.5rem,2vw,1rem);justify-content:center;flex-wrap:wrap;margin-top:2rem}
.cd-u{background:rgba(18,9,4,.55);backdrop-filter:blur(8px);border:1px solid var(--brass);min-width:78px;padding:.4rem .5rem;line-height:1.3}
.cd-u b{display:block;font-family:var(--disp);font-weight:400;font-size:2rem;color:var(--brass2)}.cd-u span{font-size:.82rem;opacity:.85}
.cue{position:absolute;bottom:22px;left:0;right:0;z-index:5;text-align:center;font-size:.75rem;letter-spacing:.4em;color:var(--brass);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.3}}

/* carved band divider (real woodwork photo) */
.carve{height:120px;background:linear-gradient(rgba(0,0,0,.35),transparent 25%,transparent 75%,rgba(0,0,0,.5)),url(assets/wada/woodwork.jpg) center 46%/cover;border-block:3px solid var(--brass);filter:sepia(.3) brightness(.85)}

/* invitation letter */
.invite{background:linear-gradient(rgba(12,6,2,.72),rgba(12,6,2,.8)),url(assets/wada/facade.jpg) center/cover;filter:none}
@media(hover:hover) and (pointer:fine){.invite,.venue,.rsvp{background-attachment:fixed}}
.letter{max-width:680px;margin:auto;padding:clamp(2.2rem,6vw,4rem) clamp(1.4rem,5vw,3.4rem) 4.4rem;color:var(--ink);position:relative;isolation:isolate;transform:rotate(-.5deg)}
.letter::before{content:"";position:absolute;inset:0;z-index:-1;filter:url(#rough);
 background:radial-gradient(ellipse at 18% 8%,rgba(255,255,255,.4),transparent 50%),radial-gradient(ellipse at 92% 96%,rgba(120,66,16,.3),transparent 45%),
 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .3 0 0 0 0 .12 0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),#ead8ab;
 box-shadow:0 35px 70px rgba(0,0,0,.65),inset 0 0 80px rgba(110,60,15,.5)}
.letter .shl{color:var(--kum);text-shadow:none}
.letter p{margin:.6rem 0}
.nm{font-family:var(--disp);font-size:clamp(1.5rem,4.5vw,2.2rem);color:var(--kum);line-height:1.4}
.sm{color:#6b4a2d;font-size:1rem}
.rule{height:1px;width:60%;margin:1.2rem auto;background:linear-gradient(90deg,transparent,#8a6a3a,transparent)}
.wax{position:absolute;left:50%;bottom:-34px;width:84px;height:84px;margin-left:-42px;border-radius:50%;display:grid;place-items:center;color:#f4c9c0;font-family:var(--disp);font-size:1.5rem;
 background:radial-gradient(circle at 35% 30%,#d34a45,#8f1d1d 60%,#560e0e);box-shadow:0 8px 14px rgba(0,0,0,.55),inset 0 -4px 8px rgba(0,0,0,.45),inset 0 3px 5px rgba(255,255,255,.25)}
.wax::before{content:"";position:absolute;inset:9px;border:1px solid rgba(255,210,200,.45);border-radius:50%}

/* couple */
.couple{display:flex;justify-content:center;gap:clamp(2rem,7vw,5rem);flex-wrap:wrap}
.pf{width:210px;height:280px;border-radius:105px 105px 6px 6px;position:relative;overflow:hidden;margin:0 auto 1rem;border:6px solid var(--brass);box-shadow:0 0 0 4px var(--wood2),0 24px 40px rgba(0,0,0,.65);background:linear-gradient(160deg,#3a2616,#1b110a)}
.pf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.pf span{position:absolute;inset:0;display:grid;place-items:center;color:rgba(201,161,90,.55);letter-spacing:.3em;font-size:.8rem}
.nm.l{color:var(--brass2)}

/* events */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1.4rem;text-align:left}
.ec{background:linear-gradient(180deg,#25160d,#190e07);border:1px solid rgba(201,161,90,.45);overflow:hidden;box-shadow:0 18px 36px rgba(0,0,0,.55);transition:transform .5s,border-color .5s}
.ec:hover{transform:translateY(-8px);border-color:var(--brass)}
.ec .ph{height:190px;overflow:hidden;position:relative}
.ec .ph img{width:100%;height:100%;object-fit:cover;filter:sepia(.2) saturate(1.1) brightness(.92);transition:transform 1.4s}
.ec:hover .ph img{transform:scale(1.1)}
.ec .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,#1b110a)}
.ec .bd{padding:.4rem 1.4rem 1.5rem}
.ec h3{font-family:var(--disp);font-weight:400;font-size:1.7rem;color:var(--brass2);line-height:1.4}
.ec .tm{color:#ffd9a0}.ec .pl{opacity:.8;font-size:.95rem}.ec p{margin-top:.5rem;font-size:.97rem;opacity:.92}
.ec.feat{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass),0 18px 40px rgba(0,0,0,.6),0 0 40px rgba(201,161,90,.25)}

/* venue */
.venue{background:linear-gradient(rgba(12,6,2,.78),rgba(12,6,2,.86)),url(assets/wada/gate2.jpg) center/cover}
.vgrid{display:grid;grid-template-columns:1fr 1.1fr;gap:2rem;align-items:center;text-align:left}
@media(max-width:760px){.vgrid{grid-template-columns:1fr;text-align:center}}
.vname{font-family:var(--disp);font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.3;color:var(--brass2)}
.map{border:6px solid var(--brass);box-shadow:0 0 0 4px var(--wood2),0 24px 50px rgba(0,0,0,.6);height:340px;position:relative;overflow:hidden;background:#2b1a10}
.map iframe{width:100%;height:100%;border:0;filter:sepia(.55) saturate(.9) contrast(1.05)}
.btn{display:inline-block;margin:.45rem .4rem 0 0;padding:.55rem 1.6rem;border:1px solid var(--brass);background:rgba(20,10,5,.6);color:var(--brass2);text-decoration:none;cursor:pointer;font-family:var(--disp);transition:.3s}
.btn:hover,.btn.fill{background:var(--brass);color:var(--wood)}

/* gallery */
.gal{columns:3 230px;column-gap:12px;text-align:left}
.gal figure{break-inside:avoid;margin:0 0 12px;position:relative;overflow:hidden;border:3px solid var(--wood2);cursor:zoom-in;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.gal img{width:100%;filter:sepia(.18) saturate(1.1);transition:transform 1.2s}
.gal figure:hover img{transform:scale(1.07)}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:1.4rem .8rem .4rem;font-size:.9rem;background:linear-gradient(transparent,rgba(0,0,0,.8));opacity:0;transition:opacity .4s}
.gal figure:hover figcaption{opacity:1}
#lb{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.93);display:none;place-items:center;cursor:zoom-out;padding:2vw}
#lb.show{display:grid}#lb img{max-width:96vw;max-height:88vh;box-shadow:0 0 60px #000}
#lb p{position:absolute;bottom:2vh;left:0;right:0;text-align:center;color:var(--brass2)}

/* rsvp */
.rsvp{background:linear-gradient(rgba(12,6,2,.7),rgba(12,6,2,.88)),url(assets/wada/diya-rangoli.jpg) center/cover}
.card{max-width:600px;margin:auto;background:rgba(18,9,4,.72);backdrop-filter:blur(10px);border:1px solid var(--brass);padding:clamp(1.6rem,5vw,3rem);box-shadow:0 30px 60px rgba(0,0,0,.6)}
.med{width:96px;height:96px;border-radius:50%;margin:-5rem auto 1rem;overflow:hidden;border:3px solid var(--brass);box-shadow:0 10px 24px rgba(0,0,0,.6)}
.med img{width:100%;height:100%;object-fit:cover;animation:spin 60s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
form{display:grid;gap:1.1rem;text-align:left;margin-top:1.2rem}
label{font-size:.92rem;color:var(--brass)}
input,select,textarea{width:100%;background:rgba(255,235,190,.07);border:0;border-bottom:1px solid var(--brass);padding:.55rem .7rem;color:var(--light);outline:0}
select option{color:#222}
input:focus,select:focus,textarea:focus{background:rgba(255,235,190,.16)}
.choice{display:flex;gap:.7rem;flex-wrap:wrap}
.choice label{flex:1;min-width:140px;text-align:center;border:1px solid var(--brass);padding:.5rem;cursor:pointer;color:var(--light)}
.choice input{display:none}.choice label:has(input:checked){background:var(--kum);border-color:var(--kum)}
.seal{width:88px;height:88px;border-radius:50%;border:0;margin:.4rem auto 0;display:block;cursor:pointer;color:#ffd9d0;font-family:var(--disp);
 background:radial-gradient(circle at 35% 30%,#d34a45,#8f1d1d 60%,#560e0e);box-shadow:0 8px 14px rgba(0,0,0,.55),inset 0 -4px 8px rgba(0,0,0,.45);transition:transform .3s}
.seal:hover{transform:scale(1.08) rotate(6deg)}
.done{display:none;font-family:var(--disp);font-size:1.5rem;color:var(--brass2);margin-top:1.2rem}.done.show{display:block;animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.7)}}

footer{background:#0d0703;text-align:center;padding:3.5rem 1.2rem 4rem;border-top:3px solid var(--brass)}
footer .bl{font-family:var(--disp);font-size:clamp(1.4rem,4vw,2.2rem);color:var(--brass2)}
details{max-width:760px;margin:1.6rem auto 0;text-align:left;font-size:.85rem;opacity:.8}
summary{cursor:pointer;text-align:center;color:var(--brass);list-style:none}
details ul{margin-top:.8rem;padding-left:1.1rem}
details a{color:var(--brass2)}
html[lang=mr] *{letter-spacing:normal!important}
.ttl,.shl,.shri{font-family:"Tiro Devanagari Marathi",serif!important;font-weight:400}
</style>
</head>
<body class="locked">
<svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="10"/></filter></svg>

<!-- INTRO: real photo of the gate; tap and the camera walks through the door -->
<div id="intro">
  <div id="cam"><img src="assets/wada/gate.jpg" alt="The main gate of a Peshwa-era wada"></div>
  <div class="shade"></div>
  <div class="ttl"><span data-t="shloka"></span><small><span data-t="guestPre"></span> <b data-guest></b></small></div>
  <button class="touch" aria-label="Open"><span class="lamp"><img src="assets/wada/rangoli.jpg" alt=""></span><span data-t="tap"></span></button>
  <div class="black"></div>
</div>

<button class="langbtn" data-lang></button>
<canvas id="dust"></canvas>

<main>
  <section id="hero">
    <div class="hbg"><img src="assets/wada/courtyard2.jpg" alt="Courtyard of a wada"></div>
    <div class="hshade"></div><div class="flick"></div>
    <div class="toranwrap"><div class="toran"></div></div>
    <div class="hin">
      <div class="shl" data-t="shloka"></div>
      <div class="sh2" data-t="shloka2"></div>
      <div class="wv rv" data-t="wedsWord"></div>
      <h1 class="names rv"><span data-t="groom"></span><i>❖</i><span data-t="bride"></span></h1>
      <div class="dt rv" data-t="dateText"></div>
      <div class="mu rv" data-t="muhurat"></div>
      <div class="cd rv" data-cd></div>
    </div>
    <div class="cue">▾</div>
  </section>

  <div class="carve"></div>

  <section class="invite">
    <div class="wrap">
      <div class="letter rv">
        <div class="shl" data-t="shloka"></div>
        <p class="sm" data-t="inviteLead"></p>
        <p data-t="inviteBody"></p>
        <div class="rule"></div>
        <p class="nm" data-t="groomFull"></p><p class="sm" data-t="groomLine"></p>
        <p class="nm" data-t="brideFull"></p><p class="sm" data-t="brideLine"></p>
        <div class="rule"></div>
        <p style="color:var(--kum)" data-t="dateText"></p><p data-t="muhurat"></p>
        <p><b data-t="venue"></b><br><span class="sm" data-t="addr"></span></p>
        <p class="sm" style="margin-top:1.2rem"><span data-t="snehankit"></span> — <b data-t="family"></b></p>
        <div class="wax">❖</div>
      </div>
    </div>
  </section>

  <div class="carve"></div>

  <section>
    <div class="wrap">
      <h2 class="rv" data-t="coupleTitle"></h2><div class="hair"></div>
      <div class="couple rv">
        <!-- drop groom.jpg / bride.jpg into wada/assets/wada/ to replace the placeholders -->
        <div><div class="pf"><span>PHOTO</span><img src="assets/wada/groom.jpg" alt="" onerror="this.remove()"></div><div class="nm l" data-t="groomFull"></div></div>
        <div><div class="pf"><span>PHOTO</span><img src="assets/wada/bride.jpg" alt="" onerror="this.remove()"></div><div class="nm l" data-t="brideFull"></div></div>
      </div>
    </div>
  </section>

  <section style="background:#160d07">
    <div class="wrap">
      <h2 class="rv" data-t="eventsTitle"></h2><div class="hair"></div>
      <div class="cards" id="cards"></div>
    </div>
  </section>

  <section class="venue">
    <div class="wrap">
      <h2 class="rv" data-t="venueTitle"></h2><div class="hair"></div>
      <div class="vgrid">
        <div class="rv">
          <div class="vname" data-t="venue"></div><p data-t="addr"></p><p style="opacity:.85" data-t="muhurat"></p>
          <a class="btn fill" data-map target="_blank" rel="noopener" data-t="directions"></a>
          <a class="btn" data-ics data-t="cal"></a>
          <a class="btn" data-share target="_blank" rel="noopener" data-t="share"></a>
        </div>
        <div class="map rv"><iframe loading="lazy" title="Map" src="https://www.openstreetmap.org/export/embed.html?bbox=73.8480%2C18.5165%2C73.8625%2C18.5225&amp;layer=mapnik&amp;marker=18.5195%2C73.8553"></iframe></div>
      </div>
    </div>
  </section>

  <section style="background:#120a05">
    <div class="wrap">
      <h2 class="rv" data-t="galleryTitle"></h2><div class="hair"></div>
      <div class="gal rv" id="gal"></div>
    </div>
  </section>

  <section class="rsvp">
    <div class="wrap" style="padding-top:8rem">
      <div class="card rv">
        <div class="med"><img src="assets/wada/rangoli.jpg" alt=""></div>
        <h2 data-t="rsvpTitle"></h2><p style="opacity:.85" data-t="rsvpSub"></p>
        <form id="rsvp">
          <div><label data-t="nameL"></label><input name="name" required></div>
          <div class="choice"><label><input type="radio" name="att" value="yes" checked><span data-t="attY"></span></label><label><input type="radio" name="att" value="no"><span data-t="attN"></span></label></div>
          <div><label data-t="cnt"></label><select name="count"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
          <div><label data-t="msgL"></label><textarea name="msg" rows="2"></textarea></div>
          <button class="seal" type="submit" data-t="send"></button>
        </form>
        <div class="done" id="done"></div>
      </div>
    </div>
  </section>

  <footer>
    <div class="bl" data-t="blessing"></div>
    <p style="margin-top:.5rem;opacity:.75"><span data-t="credit"></span> · Your Studio Name</p>
    <details><summary data-t="creditsTitle"></summary><ul id="credits"></ul></details>
  </footer>
</main>

<div id="lb"><img alt=""><p></p></div>

<script src="maharashtrian/common.js"></script>
<script src="assets/wada/credits.js"></script>
<script>
const $=s=>document.querySelector(s);
const EV_IMG=["marigold","turmeric","diya-rangoli","courtyard","facade"];
const GAL=[["courtyard2","वाड्याचे अंगण","The wada courtyard"],["gate-detail","खिळे जडवलेले द्वार","The studded gate"],["rangoli","रांगोळी व पणती","Rangoli and diya"],
 ["woodwork","कोरीव लाकूडकाम","Carved woodwork"],["marigold","झेंडूची फुले","Marigold"],["facade","वाड्याची दर्शनी बाजू","The façade"],["diya-rangoli","दिव्यांची आरास","A ring of diyas"],["turmeric","हळद","Haldi"]];
INV.onRender((t,lang)=>{
  $("#cards").innerHTML=INV.events().map((e,i)=>`<div class="ec rv${i===3?" feat":""}"><div class="ph"><img loading="lazy" src="assets/wada/${EV_IMG[i]}.jpg" alt=""></div><div class="bd"><h3>${INV.esc(e[0])}</h3><div class="tm">${INV.esc(e[1])}</div><div class="pl">${INV.esc(e[2])}</div><p>${INV.esc(e[3])}</p></div></div>`).join("");
  $("#gal").innerHTML=GAL.map(g=>`<figure><img loading="lazy" src="assets/wada/${g[0]}.jpg" alt="${g[lang==="mr"?1:2]}"><figcaption>${g[lang==="mr"?1:2]}</figcaption></figure>`).join("");
  $("#credits").innerHTML=CREDITS.map(c=>`<li><a href="${c.page}" target="_blank" rel="noopener">${INV.esc(c.title.replace(/\.jpg$/i,""))}</a> — ${INV.esc(c.author)} · <a href="${c.licenseUrl}" target="_blank" rel="noopener">${INV.esc(c.license)}</a></li>`).join("");
});
INV.rsvp($("#rsvp"),$("#done"));
INV.fx($("#dust"),{colors:["#ffcf7a","#ffb347","#fff0c2"],shape:"circle",dir:-1,speed:.22,count:34,size:[.8,2],glow:6,sway:.3,alpha:.6});
INV.render();

/* lightbox */
document.addEventListener("click",e=>{
  const f=e.target.closest(".gal figure");
  if(f){$("#lb img").src=f.querySelector("img").src;$("#lb p").textContent=f.querySelector("figcaption").textContent;$("#lb").classList.add("show")}
  else if(e.target.closest("#lb"))$("#lb").classList.remove("show");
});

/* intro: aim the camera dolly at the real door in the photo (door ~ 52.7% x, 59% y of the 1920x1440 image) */
const intro=$("#intro"),cam=$("#cam");
function aim(){
  const W=innerWidth,H=innerHeight,s=Math.max(W/1920,H/1440),w=1920*s,h=1440*s;
  cam.style.transformOrigin=`${(W-w)/2+.527*w}px ${(H-h)*.55+.59*h}px`;
}
addEventListener("resize",aim);aim();
intro.addEventListener("click",()=>{
  if(intro.classList.contains("open"))return;
  intro.classList.add("open");INV.bell();
  setTimeout(()=>{intro.classList.add("gone");document.body.classList.remove("locked");document.body.classList.add("ready")},3700);
});
</script>
</body>
</html>
