<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paithani Vivah Patrika</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&family=Yatra+One&display=swap" rel="stylesheet">
<style>
:root{--mag:#7a1250;--plum:#2b0a2e;--pea:#0e5c57;--zari:#e6b44c;--zari2:#fff1b0;--cream:#fff3d9;--ink:#33142d;
 --disp:'Yatra One','Tiro Devanagari Marathi',serif;--body:'Tiro Devanagari Marathi',Georgia,serif;
 --tile:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44'><rect width='44' height='44' fill='%237a1250'/><path d='M22 3L41 22 22 41 3 22z' fill='none' stroke='%23e6b44c' stroke-width='2'/><circle cx='22' cy='22' r='5' fill='%23e6b44c'/><circle cx='22' cy='22' r='2' fill='%230e5c57'/><circle cx='0' cy='0' r='3' fill='%23e6b44c'/><circle cx='44' cy='0' r='3' fill='%23e6b44c'/><circle cx='0' cy='44' r='3' fill='%23e6b44c'/><circle cx='44' cy='44' r='3' fill='%23e6b44c'/></svg>")}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--cream);color:var(--ink);line-height:1.9;font-size:1.1rem;overflow-x:hidden}
body.locked{overflow:hidden;height:100vh}
button,input,select,textarea{font:inherit}
.zari{background:linear-gradient(100deg,#b8862f,var(--zari2) 25%,var(--zari) 45%,#b8862f 70%,var(--zari2) 90%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-250% 0}}

/* ===== INTRO: silk cloth splits ===== */
#intro{position:fixed;inset:0;z-index:300;cursor:pointer;transition:visibility 0s 2.8s}
#intro.open{pointer-events:none;visibility:hidden}
.half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;z-index:2;transition:transform 2.5s cubic-bezier(.65,0,.2,1);box-shadow:0 0 40px rgba(0,0,0,.6)}
.half.l{left:0}.half.r{right:0}
.half.l::after,.half.r::before{content:"";position:absolute;top:0;bottom:0;width:16px;z-index:3;width:7px;background:repeating-linear-gradient(0deg,var(--zari) 0 4px,#8a5a14 4px 5px)}
.half.l::after{right:0}.half.r::before{left:0}
#intro.open .half.l{transform:translateX(-103%)}#intro.open .half.r{transform:translateX(103%)}
.cloth{position:absolute;top:0;width:100vw;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--zari2);
 background:radial-gradient(ellipse at center,#9b1a66,#6d0f48 60%,#3d0630),var(--mag)}
.half.l .cloth{left:0}.half.r .cloth{right:0}
.cloth::before,.cloth::after{content:"";position:absolute;left:0;right:0;height:64px;background:var(--tile);border-block:3px solid var(--zari)}
.cloth::before{top:0}.cloth::after{bottom:0}
.cloth .bg{position:absolute;inset:64px 0;opacity:.18;background:var(--tile);background-size:88px 88px}
.med{width:min(54vw,270px);position:relative;animation:spin 40s linear infinite;filter:drop-shadow(0 0 16px rgba(230,180,76,.55))}
@keyframes spin{to{transform:rotate(360deg)}}
.cloth h3{font-family:var(--disp);font-weight:400;font-size:clamp(1.6rem,5vw,2.8rem);position:relative;margin-top:1.4rem}
.cloth p{position:relative;font-size:1.15rem}
.hint{position:absolute;bottom:90px;left:0;right:0;text-align:center;z-index:5;color:var(--zari2);letter-spacing:.1em;animation:pulse 2.4s infinite;transition:opacity .5s}
#intro.open .hint{opacity:0}
@keyframes pulse{50%{opacity:.3}}

.side{position:fixed;top:0;bottom:0;width:clamp(12px,3vw,40px);background:var(--tile);z-index:60;box-shadow:0 0 0 2px var(--zari) inset}
.side.l{left:0}.side.r{right:0}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.langbtn{position:fixed;top:14px;right:calc(clamp(12px,3vw,40px) + 12px);z-index:80;background:var(--plum);color:var(--zari2);border:2px solid var(--zari);padding:.1rem 1rem;border-radius:20px;cursor:pointer;font-family:var(--disp)}

/* ===== page ===== */
main{opacity:0;transition:opacity 1.6s .4s}
body.ready main{opacity:1}
section{max-width:960px;margin:auto;padding:clamp(3.5rem,8vw,6rem) clamp(2rem,6vw,3.2rem);text-align:center}
.rv{opacity:0;transform:translateY(40px);transition:opacity 1.1s,transform 1.1s}.rv.in{opacity:1;transform:none}
h2{font-family:var(--disp);font-weight:400;font-size:clamp(2rem,6vw,3.2rem);color:var(--mag);line-height:1.3}
.lotus{color:var(--zari);font-size:1.4rem;margin:.2rem 0 1.6rem;letter-spacing:.6rem}
#hero{max-width:none;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cream);position:relative;overflow:hidden;
 background:radial-gradient(ellipse at 50% 20%,rgba(230,180,76,.25),transparent 60%),linear-gradient(165deg,#2b0a2e,#5a0f45 55%,#0e3b3a)}
.pk{position:absolute;bottom:4%;width:clamp(110px,22vw,260px);animation:bob 5s ease-in-out infinite;opacity:.9}
.pk.l{left:max(3vw,24px)}.pk.r{right:max(3vw,24px);transform:scaleX(-1);animation-delay:-2.5s}
@keyframes bob{50%{translate:0 -12px}}
.shl{white-space:pre-line;font-style:italic;opacity:.85;font-size:clamp(.9rem,2.3vw,1.15rem);margin:.4rem 0 1.4rem}
.wv{font-family:var(--disp);font-size:clamp(1.3rem,3.6vw,2rem);letter-spacing:.2em}
.names{font-family:var(--disp);font-weight:400;font-size:clamp(3rem,12vw,7.5rem);line-height:1.2}
.names i{display:block;font-style:normal;font-size:.28em;color:var(--zari);line-height:1}
.dt{font-size:clamp(1.2rem,3.4vw,1.8rem);margin-top:.8rem;color:var(--zari2)}
.cd{display:flex;gap:clamp(.5rem,2vw,1.2rem);justify-content:center;margin-top:2rem;flex-wrap:wrap}
.cd-u{width:84px;height:84px;border-radius:50%;border:2px solid var(--zari);display:grid;place-content:center;background:rgba(0,0,0,.28);box-shadow:0 0 18px rgba(230,180,76,.3);line-height:1.2}
.cd-u b{font-family:var(--disp);font-weight:400;font-size:1.6rem;color:var(--zari2)}.cd-u span{font-size:.75rem;opacity:.85}

.frame{background:var(--tile);padding:22px;box-shadow:0 18px 40px rgba(60,10,50,.35),0 0 0 3px var(--zari) inset}
.frame>div{background:var(--cream);padding:2.4rem clamp(1.2rem,5vw,3rem);box-shadow:0 0 0 3px var(--zari)}
.nm{font-family:var(--disp);font-size:clamp(1.5rem,4.4vw,2.2rem);color:var(--mag)}
.sm{color:#6a4560;font-size:1rem}
.letter p{margin:.6rem 0}

.couple{display:flex;justify-content:center;gap:clamp(2rem,7vw,4.5rem);flex-wrap:wrap}
.oval{width:190px;height:250px;border-radius:50%;margin:20px auto 1.4rem;position:relative;border:6px solid var(--zari);box-shadow:0 0 0 8px var(--mag),0 0 0 11px var(--zari),0 16px 30px rgba(60,10,50,.4);
 background:radial-gradient(circle at 50% 35%,#ffe6c0,#d99a6a 80%);overflow:visible}
.oval svg{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
.oval::after{content:"";position:absolute;inset:-30px;border:2px dashed var(--zari);border-radius:50%;animation:spin 30s linear infinite}

.tl{position:relative;max-width:760px;margin:2rem auto 0}
.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:linear-gradient(var(--zari),var(--mag),var(--zari))}
.ev{display:grid;grid-template-columns:1fr 46px 1fr;gap:0 1rem;align-items:center;margin-bottom:2rem}
.ev .node{grid-column:2;grid-row:1;width:40px;height:40px;border-radius:50%;background:var(--mag);border:3px solid var(--zari);color:var(--zari2);display:grid;place-items:center;font-size:1.1rem;box-shadow:0 0 0 5px var(--cream);z-index:1}
.ev .card{grid-column:1;grid-row:1;text-align:right;background:#fff;border-right:5px solid var(--zari);padding:1rem 1.3rem;box-shadow:0 10px 24px rgba(60,10,50,.18);transition:transform .4s}
.ev:nth-child(even) .card{grid-column:3;text-align:left;border-right:0;border-left:5px solid var(--zari)}
.ev .card:hover{transform:translateY(-5px)}
.card h3{font-family:var(--disp);font-weight:400;color:var(--pea);font-size:1.6rem}
.card .tm{color:var(--mag)}.card .pl{font-size:.95rem;color:#6a4560}.card p{font-size:.95rem;margin-top:.3rem}
@media(max-width:640px){.tl::before{left:20px}.ev{grid-template-columns:42px 1fr}.ev .node{grid-column:1}.ev .card,.ev:nth-child(even) .card{grid-column:2;text-align:left;border-right:0;border-left:5px solid var(--zari)}}

.venue{background:linear-gradient(165deg,#2b0a2e,#5a0f45);color:var(--cream);max-width:none}
.venue h2{color:var(--zari2)}
.vname{font-family:var(--disp);font-size:clamp(1.8rem,5vw,2.6rem)}
.btn{display:inline-block;margin:.5rem;padding:.55rem 1.8rem;border:2px solid var(--zari);border-radius:30px;color:var(--zari2);text-decoration:none;background:transparent;cursor:pointer;font-family:var(--disp);transition:.3s}
.btn:hover,.btn.fill{background:var(--zari);color:var(--plum)}

form{display:grid;gap:1.2rem;text-align:left;margin-top:1rem}
label{font-size:.95rem;color:#6a4560}
input,select,textarea{width:100%;background:transparent;border:0;border-bottom:2px solid var(--zari);padding:.5rem .2rem;color:var(--ink);outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--mag)}
.choice{display:flex;gap:.8rem;flex-wrap:wrap}
.choice label{flex:1;min-width:140px;text-align:center;border:2px solid var(--zari);border-radius:30px;padding:.4rem;cursor:pointer;color:var(--ink)}
.choice input{display:none}.choice label:has(input:checked){background:var(--mag);color:var(--zari2);border-color:var(--mag)}
.done{display:none;font-family:var(--disp);font-size:1.5rem;color:var(--pea);margin-top:1rem}.done.show{display:block;animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
footer{background:var(--tile);padding:0}
footer div{background:var(--plum);color:var(--zari2);margin:22px 0;padding:2rem 1rem;text-align:center;border-block:3px solid var(--zari)}
footer .bl{font-family:var(--disp);font-size:clamp(1.4rem,4vw,2rem)}
</style>
</head>
<body class="locked">

<!-- shared SVG symbols -->
<svg width="0" height="0" style="position:absolute"><defs>
  <g id="feather"><ellipse cx="0" cy="-30" rx="9" ry="26" fill="#0e5c57" stroke="#e6b44c" stroke-width="1.5"/><ellipse cx="0" cy="-42" rx="5" ry="8" fill="#e6b44c"/><ellipse cx="0" cy="-42" rx="2.4" ry="4" fill="#3b1a8c"/></g>
  <g id="mor">
    <g transform="translate(60,84)"><use href="#feather" transform="rotate(-72)"/><use href="#feather" transform="rotate(-36)"/><use href="#feather"/><use href="#feather" transform="rotate(36)"/><use href="#feather" transform="rotate(72)"/></g>
    <ellipse cx="60" cy="92" rx="9" ry="15" fill="#0b7a73" stroke="#e6b44c"/><circle cx="60" cy="74" r="5" fill="#0b7a73" stroke="#e6b44c"/>
    <path d="M60 69v-9M56 70l-4-8M64 70l4-8" stroke="#e6b44c" stroke-width="1.6"/>
  </g>
</defs></svg>

<!-- INTRO -->
<div id="intro">
  <div class="half l"></div><div class="half r"></div>
  <div class="hint"><span data-t="guestPre"></span> <b data-guest></b><br><span data-t="tap"></span></div>
</div>

<div class="side l"></div><div class="side r"></div>
<button class="langbtn" data-lang></button>
<canvas id="dust"></canvas>

<main>
  <section id="hero">
    <svg class="pk l" viewBox="0 0 120 110"><use href="#mor"/></svg>
    <svg class="pk r" viewBox="0 0 120 110"><use href="#mor"/></svg>
    <div class="zari" style="font-family:var(--disp);font-size:clamp(1.3rem,4vw,2rem)" data-t="shloka"></div>
    <div class="shl" data-t="shloka2"></div>
    <div class="wv zari rv" data-t="wedsWord"></div>
    <h1 class="names zari rv"><span data-t="groom"></span><i>❀ ❀ ❀</i><span data-t="bride"></span></h1>
    <div class="dt rv" data-t="dateText"></div><div class="rv" style="opacity:.8" data-t="muhurat"></div>
    <div class="cd rv" data-cd></div>
  </section>

  <section>
    <div class="frame rv"><div class="letter">
      <div class="nm" data-t="shloka"></div>
      <p class="sm" data-t="inviteLead"></p><p data-t="inviteBody"></p>
      <div class="lotus">❀</div>
      <p class="nm" data-t="groomFull"></p><p class="sm" data-t="groomLine"></p>
      <p class="nm" data-t="brideFull"></p><p class="sm" data-t="brideLine"></p>
      <div class="lotus">❀</div>
      <p style="color:var(--mag)" data-t="dateText"></p><p data-t="muhurat"></p>
      <p><b data-t="venue"></b><br><span class="sm" data-t="addr"></span></p>
      <p class="sm" style="margin-top:1.2rem"><span data-t="snehankit"></span> — <b data-t="family"></b></p>
    </div></div>
  </section>

  <section>
    <h2 class="rv" data-t="coupleTitle"></h2><div class="lotus">❀ ❀ ❀</div>
    <div class="couple rv">
      <div><div class="oval"><svg viewBox="0 0 100 130"><circle cx="50" cy="50" r="19" fill="#7a4a2a"/><path d="M12 130c2-34 20-48 38-48s36 14 38 48z" fill="#e8c24a"/><path d="M34 96q16 14 32 0" stroke="#7a1250" stroke-width="3" fill="none"/></svg></div><div class="nm" data-t="groomFull"></div></div>
      <div><div class="oval"><svg viewBox="0 0 100 130"><circle cx="50" cy="52" r="18" fill="#8a5a3a"/><path d="M30 40q20-28 40 0" fill="#2b140a"/><path d="M12 130c2-34 20-48 38-48s36 14 38 48z" fill="#7a1250"/><path d="M34 96q16 14 32 0" stroke="#e6b44c" stroke-width="3" fill="none"/><circle cx="50" cy="40" r="3" fill="#e6b44c"/></svg></div><div class="nm" data-t="brideFull"></div></div>
    </div>
  </section>

  <section>
    <h2 class="rv" data-t="eventsTitle"></h2><div class="lotus">❀ ❀ ❀</div>
    <div class="tl" id="tl"></div>
  </section>

  <section class="venue" style="max-width:none">
    <div style="max-width:760px;margin:auto">
      <h2 class="rv" data-t="venueTitle"></h2><div class="lotus">❀ ❀ ❀</div>
      <div class="vname rv" data-t="venue"></div><p class="rv" data-t="addr"></p>
      <div class="rv"><a class="btn fill" data-map target="_blank" rel="noopener" data-t="directions"></a><a class="btn" data-ics data-t="cal"></a><a class="btn" data-share target="_blank" rel="noopener" data-t="share"></a></div>
    </div>
  </section>

  <section>
    <div class="frame rv"><div>
      <h2 data-t="rsvpTitle"></h2><p class="sm" data-t="rsvpSub"></p>
      <form id="rsvp">
        <div><label data-t="nameL"></label><input name="name" required></div>
        <div class="choice"><label><input type="radio" name="att" value="yes" checked><span data-t="attY"></span></label><label><input type="radio" name="att" value="no"><span data-t="attN"></span></label></div>
        <div><label data-t="cnt"></label><select name="count"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
        <div><label data-t="msgL"></label><textarea name="msg" rows="2"></textarea></div>
        <div style="text-align:center"><button class="btn fill" type="submit" style="color:var(--plum)" data-t="send"></button></div>
      </form>
      <div class="done" id="done"></div>
    </div></div>
  </section>

  <footer><div><div class="bl zari" data-t="blessing"></div><p style="margin-top:.5rem;font-size:.95rem"><span data-t="credit"></span> · Your Studio Name</p></div></footer>
</main>

<script src="common.js"></script>
<script>
/* build the silk cloth once, put a copy on each half so the lotus splits at the seam */
(()=>{
  let p="";for(let i=0;i<12;i++)p+=`<ellipse cx="0" cy="-58" rx="17" ry="38" transform="rotate(${i*30})" fill="url(#pg)" stroke="#fff1b0" stroke-width="1"/>`;
  let q="";for(let i=0;i<12;i++)q+=`<ellipse cx="0" cy="-34" rx="9" ry="20" transform="rotate(${i*30+15})" fill="#0e5c57" stroke="#e6b44c"/>`;
  const med=`<svg class="med" viewBox="-100 -100 200 200"><defs><radialGradient id="pg"><stop offset="0" stop-color="#e6b44c"/><stop offset="1" stop-color="#9a5c10"/></radialGradient></defs>
    <circle r="96" fill="none" stroke="#e6b44c" stroke-width="2"/><circle r="90" fill="none" stroke="#e6b44c" stroke-dasharray="2 5"/>${p}${q}<circle r="16" fill="#7a1250" stroke="#fff1b0" stroke-width="2"/><circle r="6" fill="#e6b44c"/></svg>`;
  const cloth=`<div class="cloth"><div class="bg"></div>${med}<h3 class="zari" id="cn"></h3><p>॥ शुभ मंगल सावधान ॥</p></div>`;
  document.querySelector(".half.l").innerHTML=cloth;document.querySelector(".half.r").innerHTML=cloth;
})();
INV.onRender(()=>{
  document.querySelectorAll("#intro h3").forEach(h=>h.textContent=INV.t("groom")+"  ❀  "+INV.t("bride"));
  document.getElementById("tl").innerHTML=INV.events().map(e=>`<div class="ev rv"><div class="card"><h3>${INV.esc(e[0])}</h3><div class="tm">${INV.esc(e[1])}</div><div class="pl">${INV.esc(e[2])}</div><p>${INV.esc(e[3])}</p></div><div class="node">❀</div></div>`).join("");
});
INV.rsvp(document.getElementById("rsvp"),document.getElementById("done"));
const dust=INV.fx(document.getElementById("dust"),{colors:["#e6b44c","#fff1b0","#f5d27a"],shape:"circle",dir:-1,speed:.28,count:46,size:[1,2.3],glow:6,sway:.35,alpha:.7});
INV.render();
const intro=document.getElementById("intro");
intro.addEventListener("click",()=>{
  if(intro.classList.contains("open"))return;
  intro.classList.add("open");INV.bell();dust.burst(90);
  document.body.classList.add("ready");
  setTimeout(()=>document.body.classList.remove("locked"),2600);
});
</script>
</body>
</html>
